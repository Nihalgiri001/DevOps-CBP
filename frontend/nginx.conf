# ============================================================
# Nginx configuration for CommunityLink React SPA
#
# Key requirement: all unknown paths must be served index.html
# so that React Router can handle client-side navigation.
# ============================================================

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Static assets: serve directly with long-lived cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes: return index.html so React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }
}
