# ============================================================
# CommunityLink – Secret (sensitive configuration)
# Requirements: 8.1, 8.5
#
# IMPORTANT: This file is a TEMPLATE only.
# Do NOT commit real secret values to source control.
#
# Before applying, replace the placeholder with a real base64-
# encoded value:
#
#   echo -n "your-strong-jwt-secret-here" | base64
#
# Then run:
#   kubectl apply -f k8s/secret.yaml
#
# Alternatively use kubectl directly (no base64 needed):
#   kubectl create secret generic communitylink-secret \
#     --from-literal=JWT_SECRET="your-strong-jwt-secret-here" \
#     --namespace communitylink
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: communitylink-secret
  namespace: communitylink
  labels:
    app: communitylink
type: Opaque
data:
  # Replace this placeholder with: echo -n "<your-secret>" | base64
  JWT_SECRET: Y2hhbmdlLXRoaXMtc2VjcmV0LWluLXByb2R1Y3Rpb24=
  # Decoded value: change-this-secret-in-production
  # MUST be changed before deploying to a real cluster
