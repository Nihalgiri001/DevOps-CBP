# ============================================================
# CommunityLink – MongoDB Deployment + ClusterIP Service
# Requirements: 8.1, 8.4, 8.8, 8.10, 8.11
#
# Deployment:
#   - 1 replica (stateful – scale via StatefulSet in production)
#   - Liveness probe: mongosh ping every 20s
#   - PVC mounted at /data/db for durable storage
#
# Service:
#   - ClusterIP on port 27017 (internal only)
#   - Backend connects via DNS: mongodb-service:27017
# ============================================================

# ── Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: communitylink
  labels:
    app: communitylink
    component: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: communitylink
      component: mongodb
  template:
    metadata:
      labels:
        app: communitylink
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: communitylink
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc

---
# ── Service (ClusterIP – internal only) ──────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: communitylink
  labels:
    app: communitylink
    component: mongodb
spec:
  type: ClusterIP
  selector:
    app: communitylink
    component: mongodb
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: 27017
